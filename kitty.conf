shell /usr/bin/bash
startup_session ~/.config/kitty/session.conf

cursor_shape        block
cursor_text_color		#FFFF00
shell_integration		enabled no-cursor

#alt+enter opens another window in same frame
kitty_mod		 	      super

#fonts
font_family         Iosevka Light
bold_font			      Regular
italic_font         auto
bold_italic_font		auto
font_size           22.0

window_margin_width		10
single_window_margin_width	0.5

map ctrl+shift+c 	copy_to_clipboard
map ctrl+shift+v	paste_from_clipboard
map ctrl+shift+-	change_font_size all -1.0
map ctrl+shift+=	change_font_size all +1.0
# map super+enter   new_window

enabled_layouts tall,*
hide_window_decorations yes
maximize = true

